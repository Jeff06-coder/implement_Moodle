name: Docker Lint

on:
  push:
    paths:
      - 'docker/**'
  pull_request:
    paths:
      - 'docker/**'

jobs:
  docker-lint:
    runs-on: ubuntu-latest

    steps:
      # Faz o checkout do repositório para que os arquivos docker/ fiquem disponíveis
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Cria docker/.env a partir do modelo para que o docker compose config funcione no CI
      # (docker/.env é ignorado pelo Git e não existe no runner sem este passo)
      - name: Criar docker/.env a partir do exemplo (CI)
        run: cp docker/.env.example docker/.env

      # Executa o hadolint para análise estática do Dockerfile e verifica boas práticas
      # DL3008: ignorado — fixar versões apt quebra o build quando o Debian remove versões antigas.
      # DL3059: info (múltiplos RUN consolidáveis) — não bloqueia; permanece visível no log.
      - name: Lint do Dockerfile com hadolint
        run: docker run --rm -i hadolint/hadolint hadolint --failure-threshold warning --ignore DL3008 - < docker/Dockerfile

      # Valida a sintaxe e a integridade do docker-compose.yml sem subir os serviços
      # TODO: se você tiver um ambiente de testes disponível, pode estender este step
      #       executando `docker compose -f docker/docker-compose.yml up --build -d`
      #       seguido de verificações de health e `docker compose down` ao final
      - name: Validar docker-compose.yml
        run: docker compose -f docker/docker-compose.yml config --quiet
